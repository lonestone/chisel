# chisel — the "Light" pipeline: the same steps as `chisel-default` WITHOUT
# the validation sub-agents — no Checker on the spec, no `plan-review`, no
# Inspector on the diff. Human reading is the net, and the Owner placed the
# two gates himself: "Chisel-light devrait avoir une gate au design, mais pas
# au plan du maçon. Et une autre au moment de la review en place de
# l'inspector."
#
# Readable WITHOUT any ledger tooling: execute the steps as an ordered
# checklist, `needs` gives the order, and each `[steps.gate] type = "human"`
# reads "stop and ask the human before starting this step".
#
# The invoking session IS the Foreman, whose contract is
# `.agents/profiles/foreman.md`. It holds `interview`, `verify` and `close`
# itself; every other step runs as a fresh sub-agent, spawned with the step
# role's profile body plus a brief the Foreman composes from that profile's
# `Inputs` section. The human relaunches every step, as in the default.
#
# Where this preset sits: the validation sub-agents removed, the human gates
# kept where the human reads. The full reading of the axes the presets are
# placed on is in the header of
# `.agents/formulas/chisel-default.formula.toml`.
#
# Light is chosen by the human, at the sizing check — never a per-case elision
# an agent decides on its own.
#
# This file owns the ORDER and the GATES, nothing else. The requirements, the
# review surface and the task's sole status belong to the spec document; the
# program design and the progress belong to the work document the Mason
# creates at `plan`; the know-how of each step belongs to the skill that step
# names; the contract of each role belongs to its profile in
# `.agents/profiles/`; the reasoning belongs to `.agents/methodology.md`.
# Roles are roster names — a vendor or model name never appears here. Every
# write goes through the glue `.agents/project.md` (§A · Task workspace for
# paths, §B · Coordination for the tracker convention, §D living docs, §F gate
# commands, §G glossary and decisions).

formula = "chisel-light"
description = "Chisel task pipeline, light: the validation sub-agents removed, two human gates — the spec, and the diff review the human holds in place of the Inspector."
version = 1
type = "workflow"

[vars.task]
description = "Short slug of the task (used in titles)"
required = true

[vars.spec]
description = "Path to the task spec document (markdown, from the spec template)"
required = true

# ── CREATE ────────────────────────────────────────────────────────────────

[[steps]]
id = "interview"
title = "Interview: {{task}}"
type = "task"
description = """
Actor: the Foreman.
It runs the interview itself: a spawned role cannot interview the human, so
the thread owner asks and then spawns an Architect for the spec that follows.
Where the tool cannot spawn at all, the thread simply carries on in the
conversation.
Follow the `grilling` skill, with `domain-modeling` underneath. Out of it:
context, scope, acceptance criteria, and the seams the work will be tested
through — prefer existing seams, the fewer the better. Domain terms land in
the glossary and hard-to-reverse decisions in an ADR, both declared in
`.agents/project.md` §G. A design question that cannot be settled on paper
takes a detour through the `prototype` skill.
"""

[[steps]]
id = "spec"
title = "Write spec: {{task}}"
type = "task"
needs = ["interview"]
description = """
Role: Architect — contract `.agents/profiles/architect.md`.
Write {{spec}} from the spec template declared in `.agents/project.md` §A,
named with the task id script declared there. Respect the reading gradient:
the spec document's two 🧑 zones — REVIEW CAREFULLY, then REVIEW IF RELEVANT
— short and decision-rich, the detail ordered after them rather than cut.
There is no agent zone: the Mason's working space is the separate work
document it creates at `plan`.
Run the sizing check OUT LOUD: does this fit a single fresh context window AND
end in one demoable, verifiable pass? Yes → the task is its own single slice,
no breakdown artifact. No → cut it with the `slice-task` skill, one file per
slice with its blocking edges. The check's other question — which preset the
run uses — is already answered by being here.
Then record the work: a dated entry in the changelog declared in
`.agents/project.md` §A, and the coordination state per the tracker
convention of §B.
The Foreman then COMMITS the spec, as it does at `close`: a task can sit at
"spec done" for a long time, and what is not saved does not survive that wait.
Then STOP: the session that creates does not implement. The build starts
fresh from the spec/work pair — `work on task <spec-document>`, or `work on
slice <spec-document>` for a slice whose blockers are all done; the
implementing session creates the work document itself at `plan`.
"""

# ── WORK (fresh session) ──────────────────────────────────────────────────

[[steps]]
id = "plan"
title = "Plan: {{task}}"
type = "task"
needs = ["spec"]
description = """
Role: Mason — contract `.agents/profiles/mason.md`.
FIRST create the matching work document: {{spec}}'s path with `.spec.md`
replaced by `.work.md`, same directory, from the work template declared in
`.agents/project.md` §A.
The PROGRAM DESIGN, written by the session that will implement it: the target
file tree, the seam signatures, the state and migration notes, the TDD order,
the decisions the spec left to the implementation, and the short list of
evergreen doc pages (declared in `.agents/project.md` §D, never inside the
task workspace) to write at close. PERSIST it into that work document, under
its Program Design heading, BEFORE any code — a design that lives only in the
conversation does not exist. Cite the references it relies on: whoever reads
next follows links, not vibes.
It is written when the work starts, not when the spec is written: a task can
sit at "spec done" for a long time, and pseudo-code ages badly while the
system design ages well — the architecture moves far less than the code.
Read the ambient layer declared in `.agents/project.md` §C, then {{spec}} in
full plus what it links to (parent spec, prior art). {{spec}} is read-only to
the Mason: its sole status belongs to the thread owner.
This preset runs no `plan-review`: no VALIDATED verdict is coming, and the
human gate on the next step is where the design is read.
"""
[steps.gate]
type = "human"
# Gate "spec approved": the Owner validates scope, acceptance criteria, seams
# and the system design before anything is designed against the code. In this
# preset no Checker read the spec first, so this reading IS the spec review.

[[steps]]
id = "type"
title = "Type: {{task}}"
type = "task"
needs = ["plan"]
description = """
Role: Mason — contract `.agents/profiles/mason.md`.
Execute the program design persisted at `plan` in the matching work document,
ticking its implementation checkboxes as you go — they are the resume point —
and keeping its worklog as the session's written trace. The full suite is the
next step's job.
The design typed from is the one persisted at `plan`: this preset runs no
`plan-review`, so nothing else validated it.
"""

[[steps]]
id = "verify"
title = "Verify: {{task}}"
type = "task"
needs = ["type"]
description = """
Actor: the Foreman.
Mechanical verification, not a decision: run the gate commands declared in
`.agents/project.md` §F — lint, tests, build, plus a browser check when UI
behaviour changed. Evidence first: red output is reported as red, never
narrated as green. Red twice on the same cause → stop.
"""

[[steps]]
id = "diff-review"
title = "Diff review: {{task}}"
type = "task"
needs = ["verify"]
description = """
Actor: the human (the Owner).
This preset runs no Inspector. The diff is handed over with its fixed point
pinned — the review compares `<fixed point>...HEAD`, three-dot, against the
merge base — together with the path to {{spec}}: the WHOLE spec document,
system design included, is the requirement. The path to its matching work
document comes with it, as evidence only — a divergence between the two
designs is a finding, never a requirement to judge against. The `code-review`
skill is available to whoever wants its shape; nothing here spawns it.
"""
[steps.gate]
type = "human"
# Gate "the human reviews the diff": the run stops and the Owner reviews in
# the Inspector's place.

[[steps]]
id = "close"
title = "Close: {{task}}"
type = "task"
needs = ["diff-review"]
description = """
Actor: the Foreman.
Apply the arbitrated findings — anything that must be typed goes through the
Mason contract.
Promote the evergreen material FIRST, each piece from the document that
carries it: system-design and architecture diagrams from {{spec}}, as-built
seams, state machines and program-design diagrams from the matching work
document. They move into the living docs declared in `.agents/project.md` §D,
never inside the task workspace — start from its architecture index
(default `doc/architecture/ARCHITECTURE.md`); update the README when the
change is relevant to it.
Then the bookkeeping: set the status of {{spec}}, tick its acceptance criteria
and deliverables against reality, and move BOTH FILES to the archive declared
in `.agents/project.md` §A — the spec document and its matching work document
together, because sharing a directory moves neither. A sliced parent has no
work document of its own: archive the parent spec document together with its
slice folder. Add the dated entry to the changelog declared in §A and record
the closing coordination state per the §B convention. Update the roadmap
declared in §A only when it exists AND a roadmap-level change was made — it
belongs to the Owner.
Run `retro`, sort its proposals by gravity, and PROPOSE them to each touched
zone's owner; accepted ones are written in.
Then the Foreman COMMITS and PUSHES.
"""
