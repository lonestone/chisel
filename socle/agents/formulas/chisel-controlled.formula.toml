# chisel — the "Controlled" pipeline: the Owner holds every decision gate.
#
# Readable WITHOUT any ledger tooling: execute the steps as an ordered
# checklist, `needs` gives the order, and each `[steps.gate] type = "human"`
# reads "stop and ask the human before starting this step".
#
# This file owns the ORDER and the GATES, nothing else. The content and the
# progress belong to the spec file; the know-how of each step belongs to the
# skill that step names; the reasoning belongs to `.agents/methodology.md`.
# Roles are roster names and tiers are abstract (frontier / mid / cheap) — a
# vendor or model name never appears here. Every write goes through the glue
# `.agents/project.md` (§A paths, §B tracker convention, §D living docs,
# §F gate commands, §G glossary and decisions).
#
# `chisel-auto.formula.toml` is this same pipeline with the human gates
# removed and escalation in their place.

formula = "chisel-controlled"
description = "Chisel task pipeline, Controlled mode: every decision gate awaits the human (the Owner). The spec file owns the content; this formula owns the order and the gates."
version = 1
type = "workflow"

[vars.task]
description = "Short slug of the task (used in titles)"
required = true

[vars.spec]
description = "Path to the task spec file (markdown, chisel template)"
required = true

# ── CREATE ────────────────────────────────────────────────────────────────

[[steps]]
id = "interview"
title = "Interview: {{task}}"
type = "task"
description = """
Role: Architect (frontier tier).
Follow the `grilling` skill, with `domain-modeling` underneath: one question
at a time, each carrying a recommended answer; facts are looked up, decisions
belong to the Owner. Shape context, scope, acceptance criteria, and the seams
the work will be tested through — prefer existing seams, the fewer the better.
Domain terms land in the glossary and hard-to-reverse decisions in an ADR,
both declared in `.agents/project.md` §G. A design question that cannot be
settled on paper takes a detour through the `prototype` skill.
"""

[[steps]]
id = "spec"
title = "Write spec: {{task}}"
type = "task"
needs = ["interview"]
description = """
Role: Architect.
Write {{spec}} from the task file template declared in `.agents/project.md`
§A, named with the task id script declared there. Respect the reading
gradient: 🧑 zones short and decision-rich, detail in the 🤖 zone.
Run the sizing check OUT LOUD, always: does this fit a single fresh context
window AND end in one demoable, verifiable pass? Yes → the task is its own
single slice, no breakdown artifact. No → cut it with the `slice-task` skill,
one file per slice with its blocking edges. State the answer and the
recommendation explicitly — never decide it silently.
Then record the work: a dated entry in the changelog declared in
`.agents/project.md` §A, and the coordination state per the tracker
convention of §B.
Then STOP: the session that creates does not implement. The build starts
fresh from the file — `work on task <file>`, or `work on slice <file>` for a
slice whose blockers are all done.
"""

# ── WORK (fresh session) ──────────────────────────────────────────────────

[[steps]]
id = "spec-review"
title = "Spec review: {{task}}"
type = "task"
needs = ["spec"]
description = """
Role: Architect (frontier tier), a SECOND one, in a FRESH session — never the
author of {{spec}}. Reads TWO things and nothing else: the Brief and {{spec}}
— a spec needing more context than that is itself a finding. Verdict GO, or
blocking findings written into the Notes of {{spec}}. Loop with the author,
TWO rounds MAX; still blocked after the second round → escalate to the owner
of the spec, never a third round.
"""

[[steps]]
id = "plan"
title = "Plan: {{task}}"
type = "task"
needs = ["spec-review"]
description = """
Role: Architect, in a FRESH session — the build works from the file, not from
the conversation that produced it.
Read the ambient layer declared in `.agents/project.md` §C, then {{spec}} in
full plus what it links to (parent spec, prior art). Update its status. Plan
against the real code.
PERSIST the approved plan into {{spec}} BEFORE any code — the Design section
of a slice, the Implementation Decisions / Notes zones otherwise: decisions
locked, target file tree, seam signatures, state and migration notes, TDD
order, and the short list of evergreen doc pages (declared in §D, never
inside the task workspace) to write at completion. Cite the references the
plan relies on: whoever types next follows links, not vibes. A plan that
lives only in the conversation does not exist.
"""
[steps.gate]
type = "human"
# Gate "spec approved": the Owner validates scope, acceptance criteria and
# seams before anything is planned against the code — after the spec-review
# loop: the human approves a spec two Architects already agree on.

[[steps]]
id = "design-check"
title = "Design check: {{task}}"
type = "task"
needs = ["plan"]
description = """
Role: Mason (cheap tier) posts its PROGRAM DESIGN into the Design section of
{{spec}}: files, seam signatures, TDD order — no code typed here. Target
~40 lines; if it cannot fit, that is a finding about the plan's size, not a
compression exercise. The Architect who owns the plan reads the slice and
that design only, then answers VALIDATED or corrections. TWO rounds MAX, then
back to the owner of the plan as a finding AGAINST THE PLAN, never against the
Mason. Typing needs VALIDATED.
"""
[steps.gate]
type = "human"
# Gate "plan approved + typist chosen": one fused human decision, moved here
# from `type` — no Mason designs before the plan is approved. Nothing
# half-decided crosses this line, and delegation never happens without the
# human's yes.

[[steps]]
id = "type"
title = "Type: {{task}}"
type = "task"
needs = ["design-check"]
description = """
Role: Mason (cheap or mid tier) — the Architect never types what it planned,
and the typist never plans.
The brief is ARTIFACTS ONLY, never the planning conversation: {{spec}} (its
persisted Design is the core of the brief), the artifacts it explicitly
references, and the ambient layer any session in this repo gets.
Execute the persisted plan step by step. Work in vertical slices — something
demoable or verifiable at each step, never layer by layer. Test-driven at the
seams agreed in {{spec}} (`tdd` skill): red before green, one seam, one test,
one minimal implementation per cycle; tests go through public interfaces,
never internals. Run the typecheck and the touched tests as you go; the full
suite is the next step's job. Tick the implementation checkboxes in {{spec}}
as you go —
they are the resume point if this session dies.
Nothing left open crosses this line: if the plan left something to "figure
out", it goes back to the Architect.
"""

[[steps]]
id = "verify"
title = "Verify: {{task}}"
type = "task"
needs = ["type"]
description = """
Mechanical verification, not a decision: run the gate commands declared in
`.agents/project.md` §F — lint, tests, build, plus a browser check when UI
behaviour changed. Evidence first: red output is reported as red, never
narrated as green.
"""

[[steps]]
id = "review"
title = "Review: {{task}}"
type = "task"
needs = ["verify"]
description = """
Role: Inspector (frontier tier) — never the author of the plan nor of the
diff under review.
Follow the `code-review` skill: two axes in parallel from a pinned fixed
point — Standards (the repo's documented standards plus the smell baseline)
and Spec (the 🧑 zones of {{spec}} as requirements: anything missing? any
scope creep?). Report the two axes side by side; never merge them and never
re-rank findings across them.
"""

[[steps]]
id = "close"
title = "Close: {{task}}"
type = "task"
needs = ["review"]
description = """
Role: Architect or Mason.
Apply the arbitrated findings. Set the status of {{spec}}, tick acceptance
criteria and deliverables against reality, then move it to the archive
declared in `.agents/project.md` §A. Add the dated entry to the changelog
declared in §A and record the closing coordination state per the §B
convention. Update the roadmap declared in §A only when it exists AND a
roadmap-level change was made — it belongs to the Owner.
Promote the evergreen material: as-built seams, state machines and
integration diagrams move from the Design into the living docs declared in
§D, never inside the task workspace — start from its architecture index
(default `doc/architecture/ARCHITECTURE.md`); update the README when the
change is relevant to it. Protocol and evergreen pages stay generic — a
temporary rewrite label is never branded as part of the work system.
"""
[steps.gate]
type = "human"
# Gate "review arbitration": the Owner arbitrates the findings of the two
# axes before anything is closed or archived.
