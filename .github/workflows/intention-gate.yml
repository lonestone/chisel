name: Intention gate

# A pull request that changes socle/ adds an intention under
# socle/intentions/unreleased/, or carries the label no-intention
# (CONTRIBUTING.md). The rule is scripts/release-check.ts `gate`.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  intention-gate:
    name: Intention gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect skip conditions
        id: gate
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [[ ",${LABELS}," == *",no-intention,"* ]]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Label no-intention present. Skipping."
          elif [[ ",${LABELS}," == *",autorelease: pending,"* ]]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Release PR (autorelease: pending). Skipping."
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Deno
        if: steps.gate.outputs.required == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Require an intention for a socle change
        if: steps.gate.outputs.required == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${BASE_REF}"
          deno task release-check gate "origin/${BASE_REF}"
